name: CI
# PRs run affected Chromium component tests and axe stories; shared changes
# and workflow_dispatch run the full Chromium suite. Button/shared changes
# also compare captures. Shard 1 also tests the public homepage. Local pnpm
# verify and nightly CI run all browsers.
# The browser job runs as two shards. Browser images are cached in GHCR by
# recipe and toolchain hash.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  BD_BROWSERS: chromium
jobs:
  # Ensures the slim browser image for the current recipe exists in GHCR.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: tag
        run: |
          hash=$(cat ci/Containerfile.chromium ci/install-toolchain.sh | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/sanssy/bench-design-ci:$hash" >> "$GITHUB_OUTPUT"
      - name: Build and push only when the recipe changed
        env:
          REF: ${{ steps.tag.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Reusing $REF"
          else
            docker build --platform linux/amd64 -f ci/Containerfile.chromium -t "$REF" ci
            docker push "$REF"
          fi
  # Checks, unit tests, build and package test need no browser.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Node and pnpm
        run: sudo sh ci/install-toolchain.sh && node --version | grep -qx v24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:visual-values
      - run: pnpm test:package
  # Two parallel shards keep the browser job near the 2-minute budget as the
  # catalogue grows (strategy 4c, point 4).
  browser:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - name: Select and run affected browser tests
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}/2
        run: node scripts/select-browser-tests.ts --base "$BASE" --shard "$SHARD" --run
      # The public homepage reuses this Storybook build; its five browser
      # tests take seconds, so the first shard always runs them.
      - name: Assemble and test the public homepage
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: node site/build.ts && pnpm test:site
      - name: Compare approved references and retain candidates
        if: ${{ !cancelled() && steps.selection.outputs.visual == 'true' }}
        run: pnpm exec playwright test --config playwright.visual.config.ts
      - name: Upload candidates, diffs and reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
