name: CI
# PRs run Chromium only; the full three-browser run happens locally with
# `pnpm verify` before every push. main is not re-run after a squash merge.
# Captures are Chromium-only. Browser jobs use a slim Chromium image
# (ci/Containerfile.chromium) built once per recipe and cached in GHCR.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  BD_BROWSERS: chromium
jobs:
  # Ensures the slim browser image for the current recipe exists in GHCR.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: tag
        run: |
          hash=$(cat ci/Containerfile.chromium ci/install-toolchain.sh | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/sanssy/bench-design-ci:$hash" >> "$GITHUB_OUTPUT"
      - name: Build and push only when the recipe changed
        env:
          REF: ${{ steps.tag.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Reusing $REF"
          else
            docker build --platform linux/amd64 -f ci/Containerfile.chromium -t "$REF" ci
            docker push "$REF"
          fi
  # Checks, unit tests, build and package test need no browser.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Node and pnpm
        run: sudo sh ci/install-toolchain.sh && node --version | grep -qx v24.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:visual-values
      - run: pnpm test:package
  browser:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm test:browser
      - name: Compare approved references and retain candidates
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config playwright.visual.config.ts
      - name: Upload candidates, diffs and reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: button-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
