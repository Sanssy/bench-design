name: Nightly browsers
# Full suite on main using the cached three-browser image.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-browsers
  cancel-in-progress: true
env:
  CI: "true"
  STORYBOOK_DISABLE_TELEMETRY: "1"
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - id: tag
        run: |
          hash=$(cat ci/Containerfile ci/install-toolchain.sh | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/sanssy/bench-design-ci:full-$hash" >> "$GITHUB_OUTPUT"
      - name: Build and push only when the recipe changed
        env:
          REF: ${{ steps.tag.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Reusing $REF"
          else
            docker build --platform linux/amd64 -f ci/Containerfile -t "$REF" ci
            docker push "$REF"
          fi
  browser:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm test:browser
      - name: Upload candidates, diffs and reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
