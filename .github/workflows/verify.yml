name: Verify B1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build pinned verification image
        run: docker build -f ci/Containerfile -t bench-design-verify ci
      - name: Verify from a clean checkout
        run: docker run --rm --init --shm-size=1g -v "$PWD:/workspace" bench-design-verify sh -c 'pnpm install --frozen-lockfile && pnpm verify'
